<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CrediQuest – Campus Journalism Reader</title>
<style>
:root{
  --bg:#d9d6cf;
  --paper:#f5f3ee;
  --ink:#1c1b19;
  --mute:#6f6b63;
  --line:#bdb8ad;
  --hl:#e4dfd2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111}}
:root[data-theme="dark"]{--bg:#111}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:var(--paper)}
body{font-family:Georgia,"Bookerly","Times New Roman",serif;display:flex;align-items:stretch;justify-content:stretch}
.dev{
  --paper:#f5f3ee;
  --ink:#1c1b19;
  --mute:#6f6b63;
  --line:#bdb8ad;
  --hl:#e4dfd2;
  width:100%;
  height:100%;
  background:var(--paper);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.dev[data-t=sepia]{--paper:#f1e6cf;--ink:#3b2f1e;--mute:#7a6a50;--line:#cdbb98;--hl:#e3d3ae}
.dev[data-t=dark]{--paper:#17171a;--ink:#dedbd3;--mute:#8d8a82;--line:#3a3a3f;--hl:#2b2b30}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);min-height:50px;font-size:15px;background:var(--paper);z-index:4}
.top .t{flex:1;text-align:center;font-style:italic;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;font-weight:600}
.ib{padding:8px 12px;font-size:18px;border-radius:8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.ib:active{background:var(--hl)}
.main{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.bot{border-top:1px solid var(--line);padding:8px 16px;font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;font-family:system-ui,-apple-system,sans-serif;background:var(--paper)}
.bar{height:3px;background:var(--line);margin-top:0}.bar i{display:block;height:100%;background:var(--ink);transition:width .2s ease}

/* home */
.home{padding:22px 20px;text-align:center}
.cover{width:200px;height:280px;margin:8px auto 16px;background:var(--ink);color:var(--paper);padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:6px 6px 0 var(--line);border-radius:4px}
.cover b{font-size:26px;line-height:1.1}.cover span{font-size:12px;opacity:.8;font-family:system-ui,-apple-system,sans-serif}
.cover .rule{border-top:2px solid var(--paper);width:40px;margin:10px 0}
.home h1{font-size:22px;margin:6px 0 2px}.home p{color:var(--mute);font-size:14px;margin:4px 0 16px}
.btn{display:block;width:100%;padding:14px;border:1.5px solid var(--ink);border-radius:8px;margin:10px 0;font-size:16px;font-weight:600;min-height:48px}
.btn:active{opacity:0.85}
.btn.p{background:var(--ink);color:var(--paper)}
.stat{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--mute);margin:12px 0}

/* toc */
.toc{padding:6px 0}
.toc h2{font-size:20px;margin:14px 18px 6px}
.toc .r{display:flex;width:100%;text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;align-items:baseline;font-size:16px;min-height:48px}
.toc .r:active{background:var(--hl)}
.toc .r small{margin-left:auto;color:var(--mute);font-family:system-ui,-apple-system,sans-serif;font-size:12px;white-space:nowrap}
.toc .n{color:var(--mute);min-width:22px}

/* page reading view */
.pg{padding:24px 20px 48px;line-height:1.68;text-align:justify;hyphens:auto;-webkit-user-select:text;user-select:text}
.pg h2{text-align:left;font-size:1.35em;line-height:1.25;margin:0 0 16px}
.pg p{margin:0 0 1em;text-indent:0}
.pg .q{border-left:3px solid var(--ink);padding:6px 0 6px 14px;margin:0 0 1.2em;font-style:italic;text-align:left;background:var(--hl);border-radius:0 4px 4px 0}
.tag{font-family:system-ui,-apple-system,sans-serif;font-size:12px;border:1px solid var(--ink);padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:14px;font-weight:500}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:8px;margin:10px 0;line-height:1.45;font-size:.95em;min-height:48px}
.opt:active:not(:disabled){background:var(--hl)}
.opt.ok{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.opt.no{border:2px dashed var(--ink);text-decoration:line-through;opacity:0.75}
.fb{background:var(--hl);padding:14px 16px;border-radius:8px;margin-top:14px;font-size:.95em;line-height:1.5;text-align:left}

.zl,.zr{position:absolute;top:50px;bottom:36px;width:18%;z-index:2}.zl{left:0}.zr{right:0}
.pane{position:absolute;left:0;right:0;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px;z-index:10;font-family:system-ui,-apple-system,sans-serif;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,0.12)}
.pane .row{display:flex;gap:10px;align-items:center;margin:10px 0}
.pane .row button{flex:1;border:1.5px solid var(--ink);padding:10px;border-radius:8px;font-weight:600;min-height:44px}
.pane .row button.on{background:var(--ink);color:var(--paper)}

.shelf{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;padding:20px 18px 16px}
.bk{display:block;text-align:left}
.bc{aspect-ratio:2/3;background:var(--c);color:#f5f3ee;padding:16px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 9px 0 0 rgba(0,0,0,.28),4px 4px 0 var(--line);border-radius:2px 6px 6px 2px}
.bc b{font-size:15px;line-height:1.2}.bc span{font-size:10.5px;opacity:.85;font-family:system-ui,-apple-system,sans-serif}
.bp{height:4px;background:var(--line);margin:12px 0 4px;border-radius:2px;overflow:hidden}.bp i{display:block;height:100%;background:var(--ink);border-radius:2px}
.bk small{font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:var(--mute)}
.lb{padding:6px 0 24px}.lb h2{font-size:18px;margin:12px 18px 6px}

.hp{padding:20px 18px 24px}.hp h3{font-size:16px;margin:16px 0 10px;font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
.card{display:flex;gap:14px;border:1.5px solid var(--ink);padding:14px;border-radius:8px;text-align:left;width:100%;margin:0 0 20px;align-items:center;background:var(--paper)}
.card:active{background:var(--hl)}
.card .bc{width:80px;flex:none;padding:10px 6px 8px 12px}.card .bc b{font-size:11.5px}
.card .in{flex:1}.card .in b{font-size:16.5px;line-height:1.25;display:block}
.card .in small{display:block;font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:var(--mute);margin:4px 0 8px}
.card .go{font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:700;margin-top:8px;display:block;color:var(--ink)}
.row2{display:flex;gap:14px;overflow-x:auto;padding:0 4px 10px 0;margin-bottom:14px}
.row2 .bk{width:100px;flex:none}.row2 .bc b{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:20px}
.stats div{border:1px solid var(--line);padding:12px 6px;border-radius:8px}
.stats b{display:block;font-size:22px;color:var(--ink)}.stats span{font-family:system-ui,-apple-system,sans-serif;font-size:11.5px;color:var(--mute)}

.sp{position:absolute;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;cursor:pointer}
.sp.out{opacity:0;pointer-events:none}
.shelf2{display:flex;align-items:flex-end;gap:3px;padding:0 12px;border-bottom:6px solid var(--ink);height:132px}
.sb{display:block;width:var(--w);height:var(--h);background:var(--c);border-radius:2px 2px 0 0;position:relative;opacity:0;animation:drop .55s cubic-bezier(.3,1.4,.5,1) var(--d) forwards,lift .5s ease-in-out var(--l)}
.sb::before,.sb::after{content:"";position:absolute;left:3px;right:3px;height:3px;background:rgba(255,255,255,.55)}
.sb::before{top:12px}.sb::after{bottom:14px}
@keyframes drop{from{opacity:0;transform:translateY(-100px) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes lift{0%,100%{transform:none}50%{transform:translateY(-12px)}}
@keyframes fin{to{opacity:1}}
@keyframes fill{to{width:100%}}
.st{margin-top:28px;text-align:center;opacity:0;animation:fin .6s 1.3s forwards}
.st h1{font-size:28px;margin:0;letter-spacing:-0.5px}.st p{font-size:14px;color:var(--mute);margin:6px 0 0}
.sl{width:150px;height:3px;background:var(--line);margin-top:20px;opacity:0;animation:fin .3s 1.3s forwards;border-radius:2px;overflow:hidden}
.sl i{display:block;height:100%;width:0;background:var(--ink);animation:fill 1.7s 1.4s linear forwards}
.sk{position:absolute;bottom:24px;font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.sb{animation:none;opacity:1}.st,.sl{animation:none;opacity:1}.sl i{animation:none;width:100%}}
</style>
</head>
<body>
<div class="dev" id="dev" data-t="paper"></div>

<script>
const M=[
{t:'Overview of Campus Journalism',p:[
{h:'What is Campus Journalism?',b:['Campus journalism is the practice of gathering, writing, editing and publishing information for and by students within a school community.','Under Republic Act No. 7079, the Campus Journalism Act of 1991, the State promotes the development and growth of campus journalism and the skills of student journalists.','In this module you will learn who a campus journalist is, what the campus paper is for, and the values that guide the work.']},
{h:'The role of the campus press',b:['A campus paper informs, educates, and gives voice to students. It reports school events, explains issues, and holds a space for opinion.','Good campus journalism is accurate, fair, and useful to its readers.']},
{k:'Quick check',q:'Which law promotes the development of campus journalism in the Philippines?',o:['R.A. 10533','R.A. 7079','R.A. 9710','R.A. 10173'],a:1,w:'R.A. 7079, the Campus Journalism Act of 1991, supports student journalists and campus publications.'}]},
{t:'Pre-Writing Concerns',p:[
{h:'Before you write',b:['Strong stories begin before the first sentence. Choose a newsworthy angle, identify your sources, and plan your questions.','Newsworthiness is measured by timeliness, proximity, prominence, impact, and human interest.']},
{k:'Source verification',q:'A classmate tells you the school will cancel classes tomorrow. What is your best next step?',o:['Publish it right away','Confirm with the school administration','Ask two more classmates','Wait for others to publish first'],a:1,w:'Verify with an official, primary source before publishing. Repeating what others say is not verification.'}]},
{t:'Campus News Writing',p:[
{h:'The 5Ws and 1H',b:['Every news story answers six questions: Who, What, When, Where, Why, and How.','The lead, or first paragraph, carries the most important of these answers in one clear sentence.']},
{h:'The inverted pyramid',b:['Place the most important facts first, then supporting details, then background.','Readers may stop at any point, so the story must still make sense when cut from the bottom.','Example lead:']},
{k:'Activity: choose the strongest lead',q:'Which is the best news lead?',o:['The Supreme Student Government held a meeting yesterday.','Bicol University Polangui students will pay no new fees next semester, the SSG announced Tuesday.','There was a very important announcement today that students may like.','Students, listen up: fees are a hot topic!'],a:1,w:'It states who, what, and when in a single direct sentence and leads with the news.'},
{k:'Ethics scenario',q:'A source asks you to remove a direct quote that is accurate and on the record. What should you do?',o:['Remove it to keep the peace','Keep it and discuss accuracy with your editor','Change the wording so it sounds better','Publish without telling the source'],a:1,w:'Accurate quotations stay. Consult your editor and explain your reasoning to the source.'}]},
{t:'Feature and Science Writing',p:[{h:'Telling a human story',b:['A feature explores people, trends, or ideas in depth. Its lead may be a scene, a quote, or a question.','Science writing translates technical findings into plain, accurate language for general readers.']}]},
{t:'Editorial and Opinion Writing',p:[{h:'Taking a stand',b:['An editorial presents the staff’s reasoned position on an issue. It states the issue, argues a view with evidence, and ends with a solution or call to action.']}]},
{t:'Sports Writing',p:[{h:'Beyond the score',b:['A sports story reports the result, key plays, and the people behind them. Accuracy of names, scores, and statistics matters most.']}]},
{t:'Revising, Editing and Copyreading',p:[{h:'Polishing the copy',b:['Revise for structure and clarity, edit for style, and proofread for grammar, spelling, and mechanics.','Copyreaders also write headlines and check facts against the source.']}]},
{t:'Photojournalism',p:[{h:'Pictures that report',b:['A news photo tells a story on its own. Good captions identify who, what, when, and where.']}]},
{t:'Cartooning and Lay-outing',p:[{h:'Visual communication',b:['Editorial cartoons make a point through symbols and humor. Layout guides the reader’s eye through headlines, photos, and text.']}]},
{t:'Script Writing and Newscasting',p:[{h:'Writing for the ear',b:['Broadcast copy is short, conversational, and written to be heard. Read every line aloud before you air it.']}]},
{t:'Desktop Publishing',p:[{h:'From draft to print',b:['Desktop publishing combines text, images, and layout into a finished publication ready for print or online release.']}]}
];

const C=['#2f4a5a','#6b3b3b','#3d5a45','#5a4a2f','#4a3d5a','#2f5a56','#5a3d4d','#44505a','#5a5a2f','#3a3a3a','#5a3a2a'];

// Restore saved state from localStorage if available
let savedSeen = [];
let savedBookmarks = [];
let savedAnswers = {};
let savedLast = {};
let savedTheme = 'paper';
let savedFs = 17;

try {
  savedSeen = JSON.parse(localStorage.getItem('cq_seen') || '[]');
  savedBookmarks = JSON.parse(localStorage.getItem('cq_bm') || '[]');
  savedAnswers = JSON.parse(localStorage.getItem('cq_ans') || '{}');
  savedLast = JSON.parse(localStorage.getItem('cq_last') || '{}');
  savedTheme = localStorage.getItem('cq_theme') || 'paper';
  savedFs = parseInt(localStorage.getItem('cq_fs') || '17', 10);
} catch(e) {}

const S={
  v:'hub',
  m:0,
  p:0,
  fs:savedFs,
  seen:new Set(savedSeen),
  bm:new Set(savedBookmarks),
  ans:savedAnswers,
  last:savedLast,
  cur:Object.keys(savedLast).length>0?parseInt(Object.keys(savedLast)[0],10):0,
  pane:false
};

const dev=document.getElementById('dev');
dev.dataset.t = savedTheme;

const tot=M.reduce((a,m)=>a+m.p.length,0);
const mp=i=>Math.round(M[i].p.filter((_,j)=>S.seen.has(i+'-'+j)).length/M[i].p.length*100);

// Android Bridge Communication
function sendToAndroid(action, payload) {
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.postMessage === 'function') {
      window.AndroidBridge.postMessage(JSON.stringify({ action: action, payload: payload }));
    }
  } catch(e) {
    console.warn("AndroidBridge error", e);
  }
}

function persistState() {
  try {
    localStorage.setItem('cq_seen', JSON.stringify([...S.seen]));
    localStorage.setItem('cq_bm', JSON.stringify([...S.bm]));
    localStorage.setItem('cq_ans', JSON.stringify(S.ans));
    localStorage.setItem('cq_last', JSON.stringify(S.last));
    localStorage.setItem('cq_theme', dev.dataset.t);
    localStorage.setItem('cq_fs', S.fs);
  } catch(e) {}

  // Calculate high-level stats for native app
  const doneCount = M.filter((_,i)=>mp(i)===100).length;
  let qa=0, qc=0, qt=0;
  M.forEach((mm,i)=>mm.p.forEach((p,j)=>{
    if(p.q){
      qt++;
      const a = S.ans[i+'-'+j];
      if(a!==undefined){ qa++; if(a===p.a) qc++; }
    }
  }));

  sendToAndroid('stats_updated', {
    totalModules: M.length,
    completedModules: doneCount,
    totalQuizzes: qt,
    answeredQuizzes: qa,
    correctQuizzes: qc,
    currentModuleIndex: S.m,
    currentModuleTitle: M[S.m]?.t || '',
    currentPageIndex: S.p,
    theme: dev.dataset.t,
    fontSize: S.fs,
    bookmarksCount: S.bm.size,
    bookmarks: [...S.bm].map(k=>{
      const [a,b]=k.split('-').map(Number);
      return { moduleIndex: a, pageIndex: b, moduleTitle: M[a].t, pageTitle: M[a].p[b].h || M[a].p[b].k || 'Page ' + (b+1) };
    })
  });
}

function render(){
 let h='';
 if(S.v==='hub'){
  const ci=S.cur===undefined?0:S.cur,cm=M[ci],cp=mp(ci),done=M.filter((_,i)=>mp(i)===100).length;
  let qa=0,qc=0,qt=0;M.forEach((mm,i)=>mm.p.forEach((p,j)=>{if(p.q){qt++;const a=S.ans[i+'-'+j];if(a!==undefined){qa++;if(a===p.a)qc++}}}));
  const nxt=M.map((_,i)=>i).filter(i=>mp(i)<100&&i!==ci).slice(0,6);
  h=`<div class="top"><span class="t" style="font-style:normal;color:var(--ink)">CrediQuest Reader</span></div><div class="main"><div class="hp"><h1 style="font-size:24px;margin:0">CrediQuest</h1><p style="color:var(--mute);font-size:14px;margin:2px 0 20px">Campus Journalism · Eng Ed 23 supplementary reader</p>
  <h3>${S.cur===undefined?'Start reading':'Continue reading'}</h3>
  <button class="card" onclick="open_(${ci},${cp===100?0:(S.last[ci]||0)})"><div class="bc" style="--c:${C[ci%C.length]}"><span>Module ${ci+1}</span><b>${cm.t}</b></div><div class="in"><b>${cm.t}</b><small>Module ${ci+1} · ${cp}% read</small><div class="bp" style="margin:0"><i style="width:${cp}%"></i></div><span class="go">${cp===0?'Start':cp===100?'Read again':'Resume'}</span></div></button>
  <h3>Your progress</h3><div class="stats"><div><b>${done}/${M.length}</b><span>modules finished</span></div><div><b>${qa}/${qt}</b><span>quick checks</span></div><div><b>${qc}</b><span>correct</span></div></div>
  <h3>Up next</h3><div class="row2">`+nxt.map(i=>`<button class="bk" onclick="cover(${i})"><div class="bc" style="--c:${C[i%C.length]}"><span>Module ${i+1}</span><b>${M[i].t}</b></div></button>`).join('')+`</div></div></div>`;
 } else if(S.v==='home'){
  h=`<div class="top"><button class="ib" onclick="go('hub')" aria-label="Home" style="font-size:15px">‹ Home</button><span class="t" style="font-style:normal;color:var(--ink)">My Library</span><span style="width:44px"></span></div><div class="main"><div class="shelf">`+
  M.map((m,i)=>{const pc=mp(i);return `<button class="bk" onclick="cover(${i})"><div class="bc" style="--c:${C[i%C.length]}"><span>Module ${i+1}</span><b>${m.t}</b><span>CrediQuest</span></div><div class="bp"><i style="width:${pc}%"></i></div><small>${pc===0?'New':pc===100?'Finished':pc+'% read'}</small></button>`}).join('')+'</div>';
  if(S.bm.size){h+='<div class="toc lb"><h2>Bookmarks</h2>';[...S.bm].forEach(k=>{const[a,b]=k.split('-').map(Number);h+=`<button class="r" onclick="open_(${a},${b})"><span class="n">🔖</span><span>${M[a].t}</span><small>Page ${b+1}</small></button>`});h+='</div>'}
  h+='</div>';
 } else if(S.v==='cover'){
  const m=M[S.m],pc=mp(S.m),nx=S.m<M.length-1;
  h=`<div class="top"><button class="ib" onclick="exitToLibrary()" aria-label="Library">‹ Library</button><span class="t">Module ${S.m+1}</span><span style="width:60px"></span></div><div class="main"><div class="home"><div class="cover" style="background:${C[S.m%C.length]};color:#f5f3ee;--paper:#f5f3ee"><div><span>CrediQuest · Eng Ed 23</span><div class="rule"></div><b>${m.t}</b></div><span>Module ${S.m+1} of ${M.length}</span></div><h1>${m.t}</h1><p>${m.p.length} page${m.p.length>1?'s':''}</p><div class="bar"><i style="width:${pc}%"></i></div><div class="stat">${pc}% read</div><button class="btn p" onclick="open_(${S.m},${pc===100?0:(S.last[S.m]||0)})">${pc===0?'Start reading':pc===100?'Read again':'Continue'}</button>${nx?`<button class="btn" onclick="cover(${S.m+1})">Next module</button>`:''}</div></div>`;
 } else {
  const m=M[S.m],pg=m.p[S.p],key=S.m+'-'+S.p,bk=S.bm.has(key);
  let body='';
  if(pg.q){const a=S.ans[key];
   body=`<span class="tag">${pg.k}</span><h2 style="font-size:1.15em;font-weight:600;line-height:1.5;margin-bottom:12px">${pg.q}</h2>`+
   pg.o.map((o,i)=>`<button class="opt ${a!==undefined?(i===pg.a?'ok':i===a?'no':''):''}" ${a!==undefined?'disabled':''} onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')+
   (a!==undefined?`<div class="fb"><b>${a===pg.a?'Correct.':'Not quite.'}</b> ${pg.w}</div>`:'');
  } else {
   body=`<h2>${pg.h}</h2>`+pg.b.map(p=>`<p>${p}</p>`).join('');
   if(S.m===2&&S.p===1)body+='<div class="q">“Bicol University Polangui students will pay no new fees next semester, the SSG announced Tuesday.”</div>';
  }
  h=`<div class="top"><button class="ib" onclick="exitToLibrary()" aria-label="Back" style="font-size:14px">‹ Back</button><span class="t">${m.t}</span>
  <button class="ib" onclick="tp()" aria-label="Display settings">Aa</button><button class="ib" onclick="bmk()" aria-label="Bookmark">${bk?'🔖':'▫'}</button></div>
  <div class="main" id="mn">${S.pane?`<div class="pane"><div class="row"><button onclick="fs(-1)">A−</button><button onclick="fs(1)">A+</button></div><div class="row">${['paper','sepia','dark'].map(t=>`<button class="${dev.dataset.t===t?'on':''}" onclick="th('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>`:''}
  <button class="zl" onclick="nav(-1)" aria-label="Previous page"></button><button class="zr" onclick="nav(1)" aria-label="Next page"></button>
  <div class="pg" style="font-size:${S.fs}px">${body}</div></div>
  <div class="bar"><i style="width:${mp(S.m)}%"></i></div>
  <div class="bot"><span>Module ${S.m+1} · Page ${S.p+1} of ${m.p.length}</span><span>${mp(S.m)}% read</span></div>`;
 }
 dev.innerHTML=h;
}

const go=v=>{S.v=v;S.pane=false;render();persistState()};
const cover=i=>{S.m=i;go('cover')};
const open_=(m,p)=>{
  S.m=m;
  S.p=p;
  S.last[m]=p;
  S.cur=m;
  S.seen.add(m+'-'+p);
  go('read');
  sendToAndroid('reader_opened', { moduleIndex: m, pageIndex: p, moduleTitle: M[m].t });
};

function exitToLibrary() {
  sendToAndroid('reader_closed', { moduleIndex: S.m, pageIndex: S.p });
  go('home');
}

function nav(d){
  let p=S.p+d;
  if(p<0)return;
  if(p>=M[S.m].p.length){go('cover');return}
  S.p=p;
  S.last[S.m]=p;
  S.cur=S.m;
  S.pane=false;
  S.seen.add(S.m+'-'+p);
  render();
  persistState();
}

const pick=i=>{
  S.ans[S.m+'-'+S.p]=i;
  const isCorrect = M[S.m].p[S.p].a === i;
  sendToAndroid('quiz_answered', {
    moduleIndex: S.m,
    pageIndex: S.p,
    choiceIndex: i,
    isCorrect: isCorrect,
    explanation: M[S.m].p[S.p].w
  });
  render();
  persistState();
};

const tp=()=>{S.pane=!S.pane;render()};
const bmk=()=>{
  const k=S.m+'-'+S.p;
  const isNowBookmarked = !S.bm.has(k);
  if(isNowBookmarked) S.bm.add(k); else S.bm.delete(k);
  sendToAndroid('bookmark_toggled', {
    moduleIndex: S.m,
    pageIndex: S.p,
    isBookmarked: isNowBookmarked,
    moduleTitle: M[S.m].t
  });
  render();
  persistState();
};

const fs=d=>{S.fs=Math.min(26,Math.max(13,S.fs+d*2));render();persistState()};
const th=t=>{dev.dataset.t=t;render();persistState()};

// Public Native Bridge Hooks for Kotlin
window.nativeOpenModule = function(moduleIndex, pageIndex) {
  if (moduleIndex >= 0 && moduleIndex < M.length) {
    const p = (pageIndex !== undefined && pageIndex < M[moduleIndex].p.length) ? pageIndex : (S.last[moduleIndex] || 0);
    open_(moduleIndex, p);
  }
};

window.nativeSetTheme = function(themeName) {
  if (['paper','sepia','dark'].includes(themeName)) {
    th(themeName);
  }
};

window.nativeSetFontSize = function(delta) {
  fs(delta);
};

window.nativeToggleBookmark = function() {
  if (S.v === 'read') {
    bmk();
  }
};

window.nativeGoBack = function() {
  if (S.pane) {
    S.pane = false;
    render();
    return true;
  }
  if (S.v === 'read') {
    if (S.p > 0) {
      nav(-1);
      return true;
    } else {
      go('cover');
      return true;
    }
  }
  if (S.v === 'cover') {
    exitToLibrary();
    return true;
  }
  return false;
};

document.addEventListener('keydown',e=>{if(S.v!=='read')return;if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1)});
let x0=null;dev.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
dev.addEventListener('touchend',e=>{if(x0===null||S.v!=='read')return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)nav(d<0?1:-1);x0=null});

render();
persistState();

</script>
</body>
</html>
